<!DOCTYPE html>

<body>
    <fieldset  style="width: 500px; height: 655px; border: 4px solid black; padding: 10px;">
    <h1>RESERVATION FORM </h1>
    <h2> * denotes mandatory</h2>
    <label for="name"> *full Name:</label><br>
    <input type="text" id="first name and last name" placeholder="first name and last name" required><br><br>
    <label for="email"> *Email Address:</label><br>
    <input type="email" id="email" placeholder="email" required><br><br>
    <label for="select tour package">select tour package</label><br>
    <select name="select tour package" id="select tour package" required>
        <option value="">*select tour package*:</option>
        <option value="Morocco">Morocco</option>
        <option value="France">France</option>
        <option value="Spain">Spain</option>
        <option value="United States">United States</option>
        <option value="Canada">Canada</option>
    </select><br><br>
    <label for="date"> *arrival date:</label><br>
    <input type="date" id="date" placeholder=" arrival date" required><br><br>
    <label for="date"> *Number of persons:</label><br>
    <input type="number" id="number" placeholder="number" required><br><br>
    <label for=";;" >would you want to avail?</label>
    <form>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms"> Boarding</label><br>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms"> Fooding</label><br>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms"> Sightseeing</label><br>
    </form>
    <label for="message"> *Discout coupon code:</label><br>
    <input type="text" id="message" placeholder="message"><br><br>
    <label for=";;">Terms and Conditions*</label>
    <form>
        <input type="radio" id="terms" name="terms" required>
        <label for="terms">I agree</label><br>
        <input type="radio" id="terms" name="terms" required>
        <label for="terms">I disagree</label><br>
    </form><br>
    <button type="complete reservation">COMPLETE RESERVATION</button><br><br>
</fieldset>
</body>
</html>
